<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BK Fit">
<title>BK Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C3338">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p-purple:#B85FB6; --p-blue:#5F95B8; --p-green:#7DB85F;
  --p-tan:#B8935F;    --p-mauve:#8A7789;
  --purple-bg:rgba(184,95,182,.18);--purple-border:rgba(184,95,182,.45);
  --blue-bg:rgba(95,149,184,.18);  --blue-border:rgba(95,149,184,.45);
  --green-bg:rgba(125,184,95,.18); --green-border:rgba(125,184,95,.45);
  --tan-bg:rgba(184,147,95,.18);   --tan-border:rgba(184,147,95,.45);
  --mauve-bg:rgba(138,119,137,.28);--mauve-border:rgba(138,119,137,.55);
  --text:#f0eeea;--text2:#c8c4be;--text3:#8a8680;
  --border:rgba(255,255,255,.1);
  --card:#363d42;--card2:#3f474d;--bg:#2C3338;
  --radius:14px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:86px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#262c31;border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:9.5px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;letter-spacing:.03em;text-transform:uppercase}
.nav-btn.active{color:var(--p-green)}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* PAGES */
.page{display:none;padding:16px 16px 8px;max-width:540px;margin:0 auto}
.page.active{display:block}
.page-header{margin-bottom:18px}
.page-title{font-size:22px;font-weight:600}
.page-sub{font-size:13px;color:var(--text3);margin-top:3px}
.greet{font-size:26px;font-weight:400}
.greet .nm{font-family:'Dancing Script',cursive;font-size:34px;color:var(--p-green);font-weight:600}

/* CARD */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:15px;margin-bottom:12px}
.card-title{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:11px}
.card.flush{padding:0;overflow:hidden}

/* PHASE BANNER */
.phase-b{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--radius);background:var(--pb-bg,var(--mauve-bg));border:1px solid var(--pb-bd,var(--mauve-border));margin-bottom:13px}
.phase-b .pid{font-size:20px;font-weight:700;color:var(--pb-c,var(--p-mauve));line-height:1;flex:0 0 auto}
.phase-b .pn{font-size:14.5px;font-weight:600;line-height:1.2}
.phase-b .pw{font-size:11.5px;color:var(--text3);margin-top:2px;line-height:1.3}

/* CHIP ROW */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--green-bg);border-color:var(--green-border);color:var(--p-green)}
.chip .cl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.chip.on .cl{color:var(--p-green);opacity:.8}

/* READINESS */
.rd-row{display:flex;gap:8px;margin-bottom:10px}
.rd-btn{flex:1;padding:11px 4px;border-radius:11px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.rd-btn.on{background:var(--green-bg);border-color:var(--green-border);color:var(--p-green)}
.rd-btn.on[data-r="rough"]{background:var(--tan-bg);border-color:var(--tan-border);color:var(--p-tan)}
.bb-slide{margin-top:14px}
.bb-slide-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.bb-slide-top label{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.bb-num{font-size:27px;font-weight:700;line-height:1;color:var(--text3);transition:color .15s;font-variant-numeric:tabular-nums}
.bb-num.low{color:var(--p-purple)}
.bb-num.med{color:var(--p-tan)}
.bb-num.high{color:var(--p-green)}
.bb-slider{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(to right,var(--p-purple) 0%,var(--p-tan) 40%,var(--p-green) 75%,var(--p-blue) 100%);outline:none;cursor:pointer;display:block}
.bb-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#f0eeea;border:3px solid #8a8680;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.bb-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#f0eeea;border:3px solid #8a8680;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.bb-hint{font-size:11.5px;color:var(--text3);margin-top:7px;line-height:1.35}

/* BUDGET */
.bud{display:flex;flex-direction:column;gap:9px}
.bud-row{display:grid;grid-template-columns:74px 1fr 38px;align-items:center;gap:9px}
.bud-lb{font-size:12px;color:var(--text2);text-transform:capitalize}
.bud-tr{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bud-fl{height:100%;border-radius:4px;background:var(--bc,var(--p-green));transition:width .3s}
.bud-n{font-size:11.5px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.bud-row.done .bud-n{color:var(--p-green)}

/* SESSION CARD */
.sc{border-radius:var(--radius);border:1px solid var(--sc-bd,var(--border));background:var(--card);overflow:hidden;margin-bottom:12px}
.sc-h{padding:12px 14px;background:var(--sc-bg,var(--card2));border-bottom:1px solid var(--border)}
.sc-t{font-size:17px;font-weight:600}
.sc-m{font-size:11.5px;color:var(--text3);margin-top:3px}
.sc-b{padding:13px 14px}
.sc-list{display:flex;flex-direction:column;gap:5px}
.sc-list .li{display:flex;gap:10px;font-size:13.5px;color:var(--text2)}
.sc-list .li .d{margin-left:auto;color:var(--text3);font-size:12px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.sc-a{display:flex;gap:8px;padding:0 14px 13px}
.btn{flex:1;padding:12px;border-radius:11px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);background:var(--p-green);color:#1d2226}
.btn.sec{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.btn.sm{padding:9px;font-size:13px}
.btn:active{opacity:.85}

/* SECTION HEAD */
.gh{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;padding:6px 11px;border-radius:8px;margin-bottom:9px;display:inline-block}
.gh-warm{background:var(--blue-bg);color:var(--p-blue)}
.gh-main{background:var(--green-bg);color:var(--p-green)}
.gh-cool{background:var(--purple-bg);color:var(--p-purple)}
.gh-floor{background:var(--tan-bg);color:var(--p-tan)}
.gh-rest{background:var(--mauve-bg);color:var(--p-mauve)}

/* ACTIVE WORKOUT */
.aw-prog{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.aw-prog .f{height:100%;background:var(--p-green);transition:width .25s}
.ex{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;transition:opacity .2s}
.ex.done{opacity:.5}
.ex.done .ex-n{text-decoration:line-through}
.ex-top{display:flex;align-items:flex-start;gap:9px}
.ex-i{flex:1;min-width:0}
.ex-n{font-size:14.5px;font-weight:600;line-height:1.25}
.ex-d{font-size:12.5px;color:var(--text3);margin-top:2px}
.ex-btns{display:flex;gap:6px;flex:0 0 auto}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.ib.chk{border-color:var(--green-border);color:var(--p-green)}
.ib.chk.on{background:var(--p-green);color:#1d2226;border-color:var(--p-green)}
.ib.vid{border-color:var(--blue-border);color:var(--p-blue)}
.ib.swp{border-color:var(--purple-border);color:var(--p-purple)}
.wt{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.wt label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.wt input{width:62px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:600;text-align:center;font-family:var(--font)}
.wt .last{font-size:11.5px;color:var(--text3);margin-left:auto}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:200;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--text3);opacity:.5;margin:6px auto 14px}
.sh-t{font-size:18px;font-weight:600;margin-bottom:4px}
.sh-s{font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.45}
.sh-v{width:100%;border-radius:12px;background:#000;margin-bottom:12px;display:block}
.noclip{padding:22px 14px;border-radius:12px;background:var(--card2);border:1px dashed var(--border);text-align:center;font-size:13px;color:var(--text3);margin-bottom:12px;line-height:1.5}

/* FORM */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;font-family:var(--font)}
.fld textarea{min-height:70px;resize:vertical;font-size:14px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font);font-weight:500}
.opt.on{background:var(--green-bg);border-color:var(--green-border);color:var(--p-green)}

/* LOG LIST */
.lg{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);align-items:center}
.lg-kebab{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.lg-kebab:active{background:var(--card2)}
.lg:last-child{border-bottom:none}
.lg-d{width:6px;height:6px;border-radius:50%;background:var(--lc,var(--p-green));flex:0 0 auto}
.lg-i{flex:1;min-width:0}
.lg-n{font-size:14px;font-weight:500}
.lg-m{font-size:11.5px;color:var(--text3);margin-top:1px}
.lg-t{font-size:11.5px;color:var(--text3);flex:0 0 auto;text-align:right}

/* STATS */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.st{background:var(--card2);border-radius:12px;padding:12px 10px;text-align:center}
.st-n{font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.st-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;line-height:1.25}
.streak{background:linear-gradient(135deg,#4a3b52,#3a4a3c);border-radius:var(--radius);padding:17px;margin-bottom:12px;text-align:center}
.streak .n{font-size:38px;font-weight:700;line-height:1}
.streak .l{font-size:12px;color:var(--text2);margin-top:4px}

/* BADGES */
.bdg{display:flex;flex-wrap:wrap;gap:7px}
.bd{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--text3)}
.bd.got{background:var(--green-bg);border-color:var(--green-border);color:var(--p-green)}

/* MISC */
.note{font-size:12.5px;line-height:1.5;color:var(--text2);background:var(--card2);border-left:3px solid var(--nc,var(--p-green));padding:10px 12px;border-radius:0 9px 9px 0;margin-top:11px}
.note b{color:var(--text)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1d2226;color:var(--text);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid var(--border);max-width:88%;text-align:center}
.toast.on{opacity:1}
.back{background:none;border:none;color:var(--text3);font-size:14px;display:flex;align-items:center;gap:5px;padding:4px 0;margin-bottom:12px;cursor:pointer;font-family:var(--font)}
.empty{text-align:center;padding:30px 16px;color:var(--text3);font-size:13.5px;line-height:1.6}
.rowbtn{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;color:var(--text);font-size:14.5px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:10px}
.rowbtn .sub{font-size:12px;color:var(--text3);margin-top:2px}
.rowbtn .ar{margin-left:auto;color:var(--text3)}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.mini{font-size:11.5px;color:var(--text3);line-height:1.5}
</style>
</head>
<body>

<!-- ══ TODAY ══ -->
<div class="page active" id="pg-today">
  <div class="page-header">
    <div class="greet"><span id="greet-t">Good morning</span> <span class="nm">Chloe</span></div>
    <div class="page-sub" id="today-date"></div>
  </div>
  <div id="phase-banner"></div>
  <div id="phase-nudge"></div>
  <div class="card">
    <div class="card-title">How are you today?</div>
    <div class="rd-row" id="rd-row">
      <button class="rd-btn" data-r="rough">Rough</button>
      <button class="rd-btn" data-r="ok">OK</button>
      <button class="rd-btn" data-r="good">Good</button>
    </div>
    <div class="bb-slide">
      <div class="bb-slide-top"><label for="bb-slider">Body Battery</label><span class="bb-num" id="bb-num">—</span></div>
      <input id="bb-slider" type="range" class="bb-slider" min="0" max="100" value="60">
      <div class="bb-hint" id="bb-hint">Optional — off your watch</div>
    </div>
  </div>
  <div class="chips" id="ctx-chips"></div>
  <button class="rowbtn" style="margin-bottom:12px" onclick="openLogSheet()"><div><div>Did something else today?</div><div class="sub">Yoga, a hike, anything — log it and the plan adjusts</div></div><span class="ar">+</span></button>
  <div id="export-nudge" style="margin-bottom:12px"></div>
  <div id="today-sessions"></div>
  <div class="card">
    <div class="card-title">This week</div>
    <div class="bud" id="budget"></div>
    <div class="mini" id="budget-note" style="margin-top:11px"></div>
  </div>
</div>

<!-- ══ SESSION RUNNER ══ -->
<div class="page" id="pg-run">
  <button class="back" onclick="exitRun()">‹ Back</button>
  <div class="page-header">
    <div class="page-title" id="run-title"></div>
    <div class="page-sub" id="run-meta"></div>
  </div>
  <div class="aw-prog"><div class="f" id="run-prog"></div></div>
  <div id="run-review">
    <button class="btn" id="start-session-btn" style="margin-bottom:14px" onclick="startGuided()">▶ Start session</button>
    <div id="run-body"></div>
    <div style="display:flex;gap:8px;margin:16px 0 8px">
      <button class="btn sec" onclick="finishRun(true)">Save &amp; finish</button>
      <button class="btn" onclick="finishRun(false)">Done</button>
    </div>
    <div class="mini" style="text-align:center;padding-bottom:10px">Partial counts. Leaving keeps your place.</div>
  </div>
  <div id="run-guided" style="display:none"></div>
</div>

<!-- ══ PLAN ══ -->
<div class="page" id="pg-plan">
  <div class="page-header">
    <div class="page-title">The plan</div>
    <div class="page-sub">Five phases from here to the truck</div>
  </div>
  <div id="plan-body"></div>
</div>

<!-- ══ LOG ══ -->
<div class="page" id="pg-log">
  <div class="page-header">
    <div class="page-title">Log</div>
    <div class="page-sub">Anything you do counts</div>
  </div>
  <button class="btn" style="margin-bottom:14px" onclick="openLogSheet()">+ Log an activity</button>
  <div class="card">
    <div class="card-title">Recent</div>
    <div id="log-list"></div>
  </div>
</div>

<!-- ══ PROGRESS ══ -->
<div class="page" id="pg-prog">
  <div class="page-header">
    <div class="page-title">Progress</div>
    <div class="page-sub">More than one way to be winning</div>
  </div>
  <div id="prog-body"></div>
</div>

<!-- ══ MORE ══ -->
<div class="page" id="pg-more">
  <div class="page-header">
    <div class="page-title">Settings</div>
    <div class="page-sub" id="build-tag"></div>
  </div>
  <div id="more-body"></div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-pg="today"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Today</button>
  <button class="nav-btn" data-pg="plan"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Plan</button>
  <button class="nav-btn" data-pg="log"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log</button>
  <button class="nav-btn" data-pg="prog"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Progress</button>
  <button class="nav-btn" data-pg="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>More</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   BK FIT 2.0
   Phase-driven, budget-based, generated training.
   Single file. No backend. Everything in localStorage.
   ═══════════════════════════════════════════════════════════════ */

var BUILD = '2.2.0 · 2026-09-20';

/* ─── MOVEMENT CATALOG ────────────────────────────────────────
   phase  : earliest phase this may appear (0-4)
   equip  : [] = none; 'db','chair','box','band','kb','bar','sled','gym'
   press  : intra-abdominal pressure  low | mod | high
   floor  : pelvic floor demand       low | mod | high
   impact : none | low | high
   kid    : safe with a toddler in the room
   duty   : fireground relevance tag
   vid    : clip filename in videos/ (null = not filmed yet)
─────────────────────────────────────────────────────────────── */

/* WARM-UP */

/* ═══ DATES + PHASE ═══════════════════════════════════════════ */
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function dkey(d){ d = d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function parseD(s){ if(!s) return null; var p = String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtD(d){ if(!d) return '—'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

function phaseDates(){
  var s = D.settings;
  var birth = parseD(s.birthDate) || parseD(s.dueDate);
  var recWeeks = s.delivery === 'csection' ? 8 : 6;
  var p1End = addDays(birth, recWeeks*7);
  var p2End = addDays(p1End, 14);
  var ret   = parseD(s.returnDate) || addDays(birth, 14*7);
  return {birth:birth, p1End:p1End, p2End:p2End, ret:ret, born:!!s.birthDate};
}
function suggestedPhase(){
  var t = today(), pd = phaseDates();
  if(!pd.born) return 0;
  if(t < pd.birth) return 0;
  if(t < pd.p1End) return 1;
  if(t < pd.p2End) return 2;
  if(t < pd.ret){ return p2Cleared() ? 3 : 2; }
  return p2Cleared() ? 4 : 2;
}
function curPhase(){
  var p = D.settings.phasePin;
  return (p === null || p === undefined) ? suggestedPhase() : p;
}
function phaseObj(){ return PHASES[curPhase()]; }

/* Which week of P3 are we in (1-6)? */
function p3Week(){
  var pd = phaseDates();
  var n = daysBetween(pd.p2End, today());
  return Math.max(1, Math.min(6, Math.floor(n/7)+1));
}
/* Which week of P1 (1-6)? */
function p1Week(){
  var pd = phaseDates();
  var n = daysBetween(pd.birth, today());
  return Math.max(1, Math.min(6, Math.floor(n/7)+1));
}

/* ═══ SEEDED RANDOM ═══════════════════════════════════════════ */
function hash(str){ var h = 2166136261; for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ var a = seed>>>0; return function(){ a |= 0; a = a+0x6D2B79F5 | 0; var t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function todaySeed(extra){
  var k = dkey();
  var bump = D.seedBump[k] || 0;
  return hash(k + '|' + curPhase() + '|' + (extra||'') + '|' + bump);
}
function pick(r, arr){ return arr.length ? arr[Math.floor(r()*arr.length)] : null; }
function shuffle(r, arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ═══ FILTERS ═════════════════════════════════════════════════ */
function gearOK(m){
  var g = D.settings.gear, v = D.settings.venue;
  if(v === 'city' || v === 'station') {
    /* full gym: everything except sled at city, and box/bar available */
    if(m.equip.indexOf('sled') >= 0 && v !== 'station') return false;
    return true;
  }
  for(var i=0;i<m.equip.length;i++){
    var e = m.equip[i];
    if(e === 'gym' || e === 'sled') return false;
    if(!g[e]) return false;
  }
  return true;
}
function recentIds(n){
  var out = [];
  for(var i=D.log.length-1; i>=0 && out.length<200; i--){
    var l = D.log[i];
    if(l.moves) out = out.concat(l.moves);
    if(out.length > 60) break;
  }
  return out;
}
function poolFor(cat, phase){
  var rec = recentIds(6), ex = D.settings.excluded, kids = D.settings.kids;
  return MOVES.filter(function(m){
    if(m.cat !== cat) return false;
    if(m.phase > phase) return false;
    if(ex.indexOf(m.id) >= 0) return false;
    if(kids && !m.kid) return false;
    if(!gearOK(m)) return false;
    if(m.impact === 'high' && !D.settings.runUnlocked) return false;
    return true;
  }).sort(function(a,b){
    /* anti-repeat: things used recently sink */
    return rec.indexOf(a.id) - rec.indexOf(b.id);
  });
}
function pickFresh(r, cat, phase, used){
  var pool = poolFor(cat, phase).filter(function(m){ return used.indexOf(m.id) < 0; });
  if(!pool.length) return null;
  /* weight toward the front (least recently used) */
  var take = Math.max(1, Math.ceil(pool.length * 0.6));
  var m = pick(r, pool.slice(0, take));
  if(m) used.push(m.id);
  return m;
}
function byId(id){ for(var i=0;i<MOVES.length;i++){ if(MOVES[i].id===id) return MOVES[i]; } return null; }

/* ═══ PRESCRIPTION TEXT ═══════════════════════════════════════ */
function rx(m, opts){
  opts = opts || {};
  var sets = opts.sets || m.sets || 3;
  var s = '';
  if(m.type === 'reps') s = sets + ' × ' + (opts.reps||m.reps);
  else if(m.type === 'time') s = sets + ' × ' + (opts.dur||m.dur) + ' sec';
  else if(m.type === 'dist') s = sets + ' × ' + (opts.dist||m.dist) + ' yd';
  if(m.sides) s += ' each';
  if(opts.wt) s += ' · ' + opts.wt + ' lb';
  return s;
}
function anchorWeight(mid){
  var ph = curPhase();
  var logged = D.anchors[mid];
  if(logged && logged.length){
    var last = logged[logged.length-1];
    if(last.w) return last.w;
  }
  if(ph === 3 && RAMP[mid]) return RAMP[mid][p3Week()-1];
  if(ph === 4 && RAMP[mid]) return RAMP[mid][4];
  if(ph === 2){
    var p2 = {'s-goblet':12,'h-rdl':12,'u-row':17.5,'p-floorpress':15,'y-farmer':15,'l-stepup-w':10};
    return p2[mid] || null;
  }
  if(ph <= 1){
    var p0 = {'s-goblet':20,'h-rdl':15,'u-row':20,'p-ohp-seated':12};
    return p0[mid] || null;
  }
  return null;
}

/* ═══ CARDIO TREND — walk/run get the same "learn from your own history"
   treatment strength anchors already have. Purely a nudge: it never gates
   or replaces "log it, any length always counts." ═══ */
var TREND_KINDS = ['walk','run'];
var TREND_MIN_ENTRIES = 4;   // need at least this many logged before suggesting anything
var TREND_WINDOW_DAYS = 45;  // ignore anything older when computing a trend

function fmtPace(p){ // p = minutes per mile
  if(p==null || !isFinite(p) || p<=0) return null;
  var m = Math.floor(p), s = Math.round((p-m)*60);
  if(s===60){ m++; s=0; }
  return m+':'+(s<10?'0':'')+s+'/mi';
}
function cardioHistory(kind){
  var cutoff = addDays(today(), -TREND_WINDOW_DAYS);
  return D.log.filter(function(l){
    return l.kind===kind && l.dist && l.mins && (parseD(l.date)||new Date(l.date)) >= cutoff;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });
}
function cardioAvgPace(entries){
  var d=0, m=0;
  entries.forEach(function(e){ d+=e.dist; m+=e.mins; });
  return d>0 ? m/d : null;
}
function cardioTrend(kind){
  var h = cardioHistory(kind);
  if(h.length < TREND_MIN_ENTRIES) return null;
  var recent = h.slice(-8);
  var avgDist = recent.reduce(function(a,e){return a+e.dist;},0) / recent.length;
  var avgPace = cardioAvgPace(recent);
  return {n:recent.length, avgDist:avgDist, avgPace:avgPace, targetDist:Math.round(avgDist*1.05*10)/10};
}
/* Positive = pace improved (fewer minutes per mile than a few weeks ago) */
function cardioDelta(kind){
  var h = cardioHistory(kind);
  if(h.length < TREND_MIN_ENTRIES) return null;
  var half = Math.floor(h.length/2);
  var older = cardioAvgPace(h.slice(0,half)), newer = cardioAvgPace(h.slice(-half));
  if(older==null || newer==null) return null;
  return older - newer;
}
function trendNote(kind){
  var t = cardioTrend(kind);
  if(!t) return null;
  var noun = kind==='run' ? 'runs' : 'walks';
  return 'Your last '+t.n+' '+noun+' average '+trim(t.avgDist)+' mi. Today’s stretch, if you want one: ~'+t.targetDist+' mi. Anything counts either way — this is never required.';
}

function buildStrength(r, mins){
  var ph = curPhase(), used = [], blocks = [];
  var fmts = SFORMATS.filter(function(f){ return f.phase<=ph && mins>=f.mins[0]; });
  var fmt = pick(r, fmts) || SFORMATS[0];

  /* warm-up */
  var wu = [];
  for(var i=0;i<(mins>=20?3:2);i++){ var w = pickFresh(r,'warm',ph,used); if(w) wu.push(mkItem(w,{sets:1})); }
  if(wu.length) blocks.push({h:'Warm-up', cls:'gh-warm', items:wu});

  /* anchors */
  var anchorIds = ph>=3 ? ['s-goblet','h-rdl','u-row','p-floorpress','y-farmer']
                        : ['s-goblet','u-row','h-rdl'];
  var nA = mins>=30 ? (ph>=3?5:3) : mins>=20 ? 3 : 2;
  var main = [];
  var ANCHOR_REPS = {'s-goblet':8,'h-rdl':8,'u-row':10,'p-floorpress':10,'l-stepup-w':8};
  anchorIds.slice(0,nA).forEach(function(id){
    var m = byId(id); if(!m) return;
    if(m.phase > ph) return;
    if(D.settings.excluded.indexOf(id)>=0) return;
    if(!gearOK(m)) return;
    used.push(id);
    var w = anchorWeight(id);
    var o = {sets: ph>=3?4:3, wt:w, anchor:true};
    if(ph>=3 && ANCHOR_REPS[id]) o.reps = ANCHOR_REPS[id];
    if(id === 'y-farmer'){ o.dist = ph>=3 ? CARRY_DIST[p3Week()-1] : 20; }
    main.push(mkItem(m,o));
  });
  if(main.length) blocks.push({h: ph>=3 ? 'Anchors — log these' : 'Strength', cls:'gh-main', items:main});

  /* rotating accessories */
  var acc = [], nAcc = mins>=30?3:mins>=20?2:1;
  var cats = shuffle(r, ['glute','single','push','pull','carry','hinge']);
  for(var j=0;j<nAcc;j++){
    var m2 = pickFresh(r, cats[j%cats.length], ph, used);
    if(m2) acc.push(mkItem(m2,{sets:3}));
  }
  if(acc.length) blocks.push({h:'Accessories · fresh every time', cls:'gh-main', items:acc});

  /* core */
  var core = [], nC = mins>=20?2:1;
  for(var k=0;k<nC;k++){ var c = pickFresh(r,'core',ph,used); if(c) core.push(mkItem(c,{sets:3})); }
  if(core.length) blocks.push({h:'Core', cls:'gh-main', items:core});

  /* pelvic floor + cool-down */
  var fin = [];
  var pf = pickFresh(r,'floor',ph,used); if(pf) fin.push(mkItem(pf,{sets:1}));
  var mo = pickFresh(r,'mob',ph,used);   if(mo) fin.push(mkItem(mo,{sets:1}));
  if(mins>=25){ var mo2 = pickFresh(r,'mob',ph,used); if(mo2) fin.push(mkItem(mo2,{sets:1})); }
  if(fin.length) blocks.push({h:'Finish', cls:'gh-cool', items:fin});

  return {kind:'strength', title:'Strength', meta:fmt.n+' · '+mins+' min · '+venueName(), fmtNote:fmt.note, blocks:blocks};
}

function buildCardio(r, mins){
  var ph = curPhase(), v = D.settings.venue;
  var mods = MODALITIES.filter(function(m){
    if(m.phase>ph) return false;
    if(m.venue.indexOf(v)<0) return false;
    if(D.settings.kids && !m.kid) return false;
    if(m.locked === 'running' && !D.settings.runUnlocked) return false;
    if(m.impact === 'high' && ph < 3) return false;
    return true;
  });
  if(!mods.length) mods = [MODALITIES[0]];
  /* bias toward job-specific once in P3+ */
  var duty = mods.filter(function(m){ return m.duty; });
  var mod = (ph>=3 && duty.length && r()<0.6) ? pick(r,duty) : pick(r,mods);

  var fmts = CFORMATS.filter(function(f){
    if(f.phase>ph) return false;
    if(mins < f.mins[0]) return false;
    if(f.id==='stairrep' && mod.id!=='stairs' && mod.id!=='stairmill') return false;
    if(f.id==='hill' && mod.id!=='incline') return false;
    if(f.id==='mixed' && v==='home') return false;
    if(f.id==='ruck' && ['walk','stroller','babyruck'].indexOf(mod.id)<0) return false;
    return true;
  });
  if(!fmts.length) fmts = [CFORMATS[0]];
  var dutyF = fmts.filter(function(f){ return f.duty; });
  var fmt = (ph>=3 && dutyF.length && r()<0.65) ? pick(r,dutyF) : pick(r,fmts);

  var rows = fmt.build(mod.n, mins);
  var items = rows.map(function(row){ return {mid:null, n:row[0], d:row[1]}; });
  var sess = {kind:'cardio', modId:mod.id, title:fmt.n, meta:mod.n+' · '+mins+' min · '+venueName(),
          blocks:[{h:'Cardio', cls:'gh-warm', items:items}]};
  if(TREND_KINDS.indexOf(mod.id)>=0){
    var note = trendNote(mod.id);
    if(note) sess.fmtNote = note;
  }
  return sess;
}

function buildMobility(r, mins){
  var ph = curPhase(), used = [], items = [];
  var n = mins>=20?6:4;
  for(var i=0;i<n;i++){ var m = pickFresh(r,'mob',ph,used); if(m) items.push(mkItem(m,{sets:1})); }
  var pf = pickFresh(r,'floor',ph,used); if(pf) items.push(mkItem(pf,{sets:1}));
  return {kind:'mobility', title:'Reset', meta:mins+' min · rotates daily',
          blocks:[{h:'Mobility', cls:'gh-cool', items:items}]};
}

function buildFloor(r){
  var ph = curPhase(), used = [], items = [];
  ['pf-connect','pf-holds','pf-flicks'].forEach(function(id){
    var m = byId(id); if(m && D.settings.excluded.indexOf(id)<0){ items.push(mkItem(m,{sets:1})); used.push(id); }
  });
  return {kind:'floor', title:'Pelvic floor', meta:'3 min · every day',
          blocks:[{h:'Pelvic floor', cls:'gh-floor', items:items}]};
}

function buildRecovery(r, mins){
  var wk = p1Week(), used = [], blocks = [];
  var band = wk<=2 ? 1 : wk<=4 ? 2 : 3;
  var core = [];
  if(band===1){
    core = ['pf-breath','pf-360','pf-connect','m-shoulderroll'];
  } else if(band===2){
    core = ['pf-360','pf-connect','c-heelslide','c-toetap','w-pelvictilt','w-catcow'];
  } else {

  }

function buildWalk(){
  var sess = {kind:'walk', title:'Walk', meta:'Any length · one tap to log',
          blocks:[{h:'Walk', cls:'gh-warm', items:[{mid:null,n:'Walk — stroller, treadmill, round the block',d:'no minimum'}]}], quick:true};
  var note = trendNote('walk');

  return sess;
}

/* Which sessions to offer today */
/* "No limit" — session length follows how she's actually doing today,
   not a fixed clock. Reuses the same rebased tier the readiness slider drives. */
function effectiveMins(){
  var rd = D.readiness[dkey()] || {};
  var t = tierFor(rd);
  return t === 'low' ? 15 : t === 'good' ? 40 : 25;
}
function todaysSessions(){
  var ph = curPhase(), mins = D.settings.mins === 'auto' ? effectiveMins() : D.settings.mins, out = [];
  var need = budgetState();

  if(ph === 0){
    out.push(buildWalk());
    out.push(buildMobility(rng(todaySeed('mob')), Math.min(10,mins)));
    out.push(buildFloor(rng(todaySeed('pf'))));
    out.push(buildStrength(rng(todaySeed('lift')), mins));
    out[3].title = 'Something more';
    out[3].meta = 'Optional · only if you feel like it';
    out[3].optional = true;
  } else if(ph === 1){
    out.push(buildRecovery(rng(todaySeed('rec')), mins));
    out.push(buildWalk());
    out.push(buildFloor(rng(todaySeed('pf'))));
  } else {
    /* pick the archetype with the biggest remaining need */
    var order = ['strength','cardio','mobility'].filter(function(c){ return (need[c]||{}).target > 0; });
    order.sort(function(a,b){ return (need[b].target-need[b].done) - (need[a].target-need[a].done); });
    var primary = order[0] || 'strength';
    if(primary === 'strength') out.push(buildStrength(rng(todaySeed('s')), mins));
    else if(primary === 'cardio') out.push(buildCardio(rng(todaySeed('c')), mins));
    else out.push(buildMobility(rng(todaySeed('m')), mins));

    var second = order[1];
    if(second === 'cardio') out.push(buildCardio(rng(todaySeed('c2')), Math.min(20,mins)));
    else if(second === 'strength') out.push(buildStrength(rng(todaySeed('s2')), mins));
    else out.push(buildMobility(rng(todaySeed('m2')), Math.min(15,mins)));

    out.push(buildWalk());
    out.push(buildFloor(rng(todaySeed('pf'))));
  }
  out.forEach(function(s){ s.effMins = mins; });
  return out;
}

/* ═══ BUDGET ══════════════════════════════════════════════════ */
function weekStart(d){ d = d||today(); var x = new Date(d.getTime()); var wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function logsInWeek(ws){
  var we = addDays(ws,7);
  return D.log.filter(function(l){ var d = parseD(l.date) || new Date(l.date); return d>=ws && d<we; });
}
/* what each kind of activity satisfies */
function credits(l){
  var c = {};
  var k = l.kind;
  if(k==='walk')      c.walk = 1;
  else if(k==='run')      { c.cardio = 1; }
  else if(k==='strength') { c.strength = 1; }
  else if(k==='cardio')   { c.cardio = 1; }
  else if(k==='mobility') { c.mobility = 1; }
  else if(k==='floor')    { c.floor = 1; }
  else if(k==='yoga')     { c.mobility = 1; if((l.mins||0)>=30) c.cardio = 1; }
  else if(k==='swim')     { c.cardio = 1; }
  else if(k==='other')    { c.cardio = 1; }
  if(l.partial){ for(var key in c){ c[key] = 0.5; } }
  return c;
}
function budgetState(){
  var ph = phaseObj(), b = ph.budget, ws = weekStart();
  var wk = logsInWeek(ws), out = {};
  for(var cat in b){
    out[cat] = {target: adaptiveTarget(cat, b[cat]), done: 0};
  }
  /* walk counts toward cardio too, once cardio is a target */
  wk.forEach(function(l){
    var c = credits(l);
    for(var key in c){ if(out[key]) out[key].done += c[key]; }
    if(c.walk && out.cardio) out.cardio.done += 0.5;
  });
  for(var k2 in out){ out[k2].done = Math.round(out[k2].done*10)/10; }
  return out;
}
/* Chloe's idea: expectations follow what she actually does */
function adaptiveTarget(cat, planned){
  if(planned === 0) return 0;
  var weeks = [], ws = weekStart();
  for(var i=1;i<=4;i++){
    var s = addDays(ws, -7*i);
    var ls = logsInWeek(s);
    if(!ls.length && i>2) continue;
    var n = 0;
    ls.forEach(function(l){ var c = credits(l); if(c[cat]) n += c[cat]; });
    weeks.push(n);
  }
  if(weeks.length < 3) return planned;
  weeks.sort(function(a,b){ return a-b; });
  var med = weeks[Math.floor(weeks.length/2)];
  if(med >= planned) return planned;
  /* ease toward reality but never below 1, never more than 1 under plan at a time */
  return Math.max(1, Math.min(planned, Math.round(med) + 1));
}

/* ═══ STREAK + BADGES ═════════════════════════════════════════ */
/* weeks that hit budget — one missed day cannot break it */
function streakWeeks(){
  var n = 0, ws = weekStart();
  for(var i=0;i<80;i++){
    var s = addDays(ws, -7*i);
    var ls = logsInWeek(s);
    if(i===0 && !ls.length) continue;      /* current week still in progress */
    if(!ls.length) break;
    n++;
  }
  return n;
}
function totalDistLogged(){
  return D.log.reduce(function(a,l){ return a + (l.dist||0); }, 0);
}
function checkBadges(){
  var got = D.badges, add = [];
  var total = D.log.length;
  var moves = {};
  D.log.forEach(function(l){ (l.moves||[]).forEach(function(m){ moves[m]=1; }); });
  var uniq = Object.keys(moves).length;
  function give(id){ if(got.indexOf(id)<0){ got.push(id); add.push(id); } }

  if(total>=1) give('first');
  if(total>=10) give('ten');
  if(total>=25) give('twentyfive');
  if(total>=50) give('fifty');
  if(total>=100) give('century');
  if(uniq>=10) give('explore10');
  if(uniq>=25) give('explore25');
  if(streakWeeks()>=4) give('month');
  if(Object.keys(D.anchors).length>=3) give('anchored');
  if(D.bench && D.bench.length>=1) give('benchmarked');
  if(Object.keys(D.bestPace||{}).length>=1) give('pacepr');
  if(D.log.filter(function(l){return l.kids;}).length>=10) give('kidsaround');

  var dist = totalDistLogged();
  if(dist>=10) give('mile10');
  if(dist>=25) give('mile25');
  if(dist>=50) give('mile50');

  var allCats = {}; MOVES.forEach(function(m){ allCats[m.cat]=1; });
  var triedCats = {}; MOVES.forEach(function(m){ if(moves[m.id]) triedCats[m.cat]=1; });
  if(Object.keys(triedCats).length >= Object.keys(allCats).length) give('wellrounded');

  /* returned after logging AND after every phase advance, not just via logging */
  var ph = curPhase();
  if(ph > D.maxPhaseReached) D.maxPhaseReached = ph;
  if(D.maxPhaseReached>=1) give('phase1');
  if(D.maxPhaseReached>=2) give('phase2');
  if(D.maxPhaseReached>=3) give('phase3');
  if(D.maxPhaseReached>=4) give('phase4');

  /* came back after a real gap — reframed as a win, not a broken streak */
  var dates = D.log.map(function(l){ return l.date; }).filter(Boolean).sort();
  if(dates.length>=2){
    var last = parseD(dates[dates.length-1]), prev = parseD(dates[dates.length-2]);
    if(last && prev && daysBetween(prev,last) >= 7) give('comeback');
  }

  if(add.length){ save(); }
  return add;
}
var BADGE_N = {
  first:'First one done', ten:'10 sessions', twentyfive:'25 sessions', fifty:'50 sessions', century:'100 sessions',
  explore10:'10 movements tried', explore25:'25 movements tried', wellrounded:'Tried every category',
  month:'4 weeks running', comeback:'Back at it after a break', anchored:'Anchors logged',
  benchmarked:'First benchmark done', pacepr:'First pace PR', kidsaround:'10 sessions with kids underfoot',
  mile10:'10 miles logged', mile25:'25 miles logged', mile50:'50 miles logged',
  phase1:'Into recovery', phase2:'Reconnect on-ramp', phase3:'Return prep started', phase4:'Back on duty'
};

/* ═══ POST-LOG: PR check + badge toasts ════════════════════════
   One shared path for every way a session can get logged, so nothing
   about "along the way" depends on which button she happened to tap. */
function toastQueue(msgs){
  if(!msgs || !msgs.length) return;
  var i = 0;
  (function next(){
    if(i>=msgs.length) return;
    toast(msgs[i]); i++;
    if(i<msgs.length) setTimeout(next, 2400);
  })();
}
/* Repeatable — celebrates every real improvement, not just the first ever.
   Small threshold avoids "PR" noise from rounding-level differences. */
function checkPacePR(entry){
  if(!entry || TREND_KINDS.indexOf(entry.kind)<0 || !entry.dist || !entry.mins) return null;
  var pace = entry.mins / entry.dist;
  var prev = D.bestPace[entry.kind];
  if(prev==null || pace < prev - 0.05){
    D.bestPace[entry.kind] = pace;
    return 'New pace PR — ' + fmtPace(pace) + '! 🏃';
  }
  return null;
}
/* Marked distinctly from a plain log confirmation so it reads as an
   achievement, not routine feedback — this is the part she loves. */
function badgeMsg(id){ return '🏅 New: ' + (BADGE_N[id]||id); }
function postLog(entry, fallbackMsg){
  var msgs = [fallbackMsg];
  var pr = checkPacePR(entry);
  if(pr) msgs.push(pr);
  checkBadges().forEach(function(id){ msgs.push(badgeMsg(id)); });
  save();
  toastQueue(msgs);
  renderAll();
}

/* ═══ RENDER: TODAY ═══════════════════════════════════════════ */

function renderExportNudge(){

function chip(k, label, on){
  return '<button class="chip'+(on?' on':'')+'" onclick="openCtx(\''+k+'\')"><span class="cl">'+k+'</span> '+label+'</button>';
}
function bbHint(rd){
  if(!rd.bb) return 'Optional — off your watch';
  var t = tierFor(rd);
  return 'Reads as ' + t + ' for you lately';
}
function lastKnownBB(){
  var ks = Object.keys(D.readiness).sort().reverse();
  for(var i=0;i<ks.length;i++){ var v = D.readiness[ks[i]]; if(v && v.bb) return v.bb; }
  return 60;
}
/* Absolute zone purely for the slider's own color feedback — separate from
   tierFor()'s rebased-baseline logic used to pick sessions. */
function bbZoneClass(v){
  if(v < 30) return 'low';
  if(v < 70) return 'med';
  return 'high';
}
function paintBB(setVal, shownVal){
  var num = document.getElementById('bb-num');
  if(setVal){ num.textContent = setVal; num.className = 'bb-num ' + bbZoneClass(setVal); }
  else { num.textContent = shownVal; num.className = 'bb-num'; }
}
/* BB rebased against her own rolling baseline, then the tap moves it */
function tierFor(rd){
  var vals = [];
  var ks = Object.keys(D.readiness).sort().slice(-14);
  ks.forEach(function(k){ var v = D.readiness[k]; if(v && v.bb) vals.push(v.bb); });
  var base = 'normal';
  if(rd.bb){
    if(vals.length >= 4){
      var sorted = vals.slice().sort(function(a,b){return a-b;});
      var below = sorted.filter(function(v){ return v < rd.bb; }).length;
      var pct = below / sorted.length;
      base = pct < 0.33 ? 'low' : pct > 0.66 ? 'good' : 'normal';
    } else {
      base = rd.bb < 30 ? 'low' : rd.bb > 60 ? 'good' : 'normal';
    }
    if(rd.bb < 15) base = 'low';
  }
  if(rd.feel === 'rough') base = base==='good'?'normal':'low';
  if(rd.feel === 'good')  base = base==='low'?'normal':'good';
  return base;
}
function sessionCard(s, i){
  var col = s.kind==='strength'?'green':s.kind==='cardio'?'blue':s.kind==='floor'?'tan':s.kind==='walk'?'blue':'purple';
  var body = '';
  s.blocks.forEach(function(b){
    body += '<div class="gh '+b.cls+'">'+b.h+'</div><div class="sc-list">';
    b.items.forEach(function(it){
      body += '<div class="li"><span>'+esc(it.n)+'</span>'+(it.d?'<span class="d">'+esc(it.d)+'</span>':'')+'</div>';
    });
    body += '</div>';
    if(b !== s.blocks[s.blocks.length-1]) body += '<div style="height:11px"></div>';
  });
  if(s.fmtNote) body += '<div class="note" style="--nc:var(--p-'+col+')">'+s.fmtNote+'</div>';
  var act = s.quick
    ? '<div class="sc-a"><button class="btn" onclick="quickLog(\''+s.kind+'\')">Log it</button>'+
      '<button class="btn sec sm" style="flex:0 0 auto" onclick="openLogSheet(\''+s.kind+'\')">+ distance / HR</button></div>'
    : '<div class="sc-a"><button class="btn" onclick="startRun('+i+')">Start</button></div>';
  return '<div class="sc" style="--sc-bg:var(--'+col+'-bg);--sc-bd:var(--'+col+'-border)">' +
    '<div class="sc-h"><div class="sc-t">'+esc(s.title)+(s.optional?' <span style="font-size:11px;color:var(--text3);font-weight:400">optional</span>':'')+'</div><div class="sc-m">'+esc(s.meta)+'</div></div>' +
    '<div class="sc-b">'+body+'</div>' + act + '</div>';
}
function renderBudget(){
  var b = budgetState(), out = '', cols = {walk:'blue',strength:'green',cardio:'blue',mobility:'purple',floor:'tan'};
  var order = ['strength','cardio','walk','mobility','floor'];
  order.forEach(function(cat){
    if(!b[cat] || !b[cat].target) return;
    var t = b[cat].target, d = Math.min(b[cat].done, t);
    var pctv = t ? Math.round(d/t*100) : 0;
    out += '<div class="bud-row'+(d>=t?' done':'')+'"><div class="bud-lb">'+cat+'</div>' +
      '<div class="bud-tr"><div class="bud-fl" style="width:'+pctv+'%;--bc:var(--p-'+(cols[cat]||'green')+')"></div></div>' +
      '<div class="bud-n">'+trim(b[cat].done)+'/'+t+'</div></div>';
  });
  document.getElementById('budget').innerHTML = out || '<div class="mini">Nothing targeted this week.</div>';
  var ph = phaseObj();
  var adapted = false;
  for(var c in ph.budget){ if(ph.budget[c] && adaptiveTarget(c, ph.budget[c]) !== ph.budget[c]) adapted = true; }
  document.getElementById('budget-note').textContent = adapted
    ? 'Targets tuned down to match what you have actually been doing. They climb back as you do.'
    : 'Anything you log counts against these — planned or not.';
}
function trim(n){ return (Math.round(n*10)/10).toString().replace(/\.0$/,''); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══ SESSION RUNNER ══════════════════════════════════════════ */
var RUN = null;

function startRun(i){
  var sessions = todaysSessions();
  RUN = {sess: sessions[i], state:{}, started: new Date().toISOString(), idx:i, mode:'review'};
  D.active = RUN; save();
  renderRun(); showPage('run');
}
function resumeRun(){
  if(!D.active) return;
  RUN = D.active; if(!RUN.mode) RUN.mode = 'review';
  renderRun(); showPage('run');
}
function exitRun(){
  if(RUN){ captureGuidedWeight(); D.active = RUN; save(); toast('Saved — pick it up whenever'); }
  showPage('today');
}
/* Dispatcher — review (list + swap) or guided (one set at a time) */
function renderRun(){
  var s = RUN.sess;
  document.getElementById('run-title').textContent = s.title;
  document.getElementById('run-meta').textContent = s.meta;
  if(RUN.mode === 'guided'){
    document.getElementById('run-review').style.display = 'none';
    document.getElementById('run-guided').style.display = 'block';
    renderGuidedStep();
  } else {
    document.getElementById('run-review').style.display = 'block';
    document.getElementById('run-guided').style.display = 'none';
    renderReview();
  }
}
function renderReview(){
  var s = RUN.sess;
  var total = 0, done = 0, out = '';
  var hasMoves = s.blocks.some(function(b){ return b.items.some(function(it){ return !!it.mid; }); });
  var startBtn = document.getElementById('start-session-btn');
  if(startBtn) startBtn.style.display = hasMoves ? 'block' : 'none';
  s.blocks.forEach(function(b, bi){
    out += '<div class="gh '+b.cls+'">'+b.h+'</div>';
    b.items.forEach(function(it, ii){
      var key = bi+'_'+ii, st = RUN.state[key] || {};
      total++; if(st.done) done++;
      var m = it.mid ? byId(it.mid) : null;
      out += '<div class="ex'+(st.done?' done':'')+'">' +
        '<div class="ex-top"><div class="ex-i"><div class="ex-n">'+esc(it.n)+'</div>' +
        (it.d?'<div class="ex-d">'+esc(it.d)+'</div>':'') + '</div><div class="ex-btns">' +
        (m ? '<button class="ib vid" onclick="showMove(\''+it.mid+'\')">▶</button>' : '') +
        (m ? '<button class="ib swp" onclick="swapMove('+bi+','+ii+')">⇄</button>' : '') +
        '<button class="ib chk'+(st.done?' on':'')+'" onclick="toggleEx('+bi+','+ii+')">✓</button>' +
        '</div></div>';
      if(it.anchor){
        var last = lastAnchor(it.mid);
        out += '<div class="wt"><label>Weight</label><input type="number" inputmode="decimal" value="'+(st.w!==undefined?st.w:(it.wt||''))+'" onchange="setWt('+bi+','+ii+',this.value)">' +
          '<span class="last">'+(last? 'last '+last+' lb':'first time')+'</span></div>';
      }
      out += '</div>';
    });
  });
  document.getElementById('run-body').innerHTML = out;
  document.getElementById('run-prog').style.width = total? Math.round(done/total*100)+'%' : '0%';
}

/* ─── GUIDED MODE — one movement/set at a time, video up, tap Next ─── */
function buildGuidedSteps(){
  var steps = [];
  RUN.sess.blocks.forEach(function(b, bi){
    b.items.forEach(function(it, ii){
      var key = bi+'_'+ii, totalSets = it.sets || 1;
      if(it.mid){
        for(var k=1;k<=totalSets;k++){
          steps.push({bi:bi, ii:ii, key:key, head:b.head, mid:it.mid, name:it.n, setIdx:k, totalSets:totalSets, target:it.d, anchor:!!it.anchor});
        }
      } else {
        /* cardio rows and other non-movement instructions: one step, no video */
        steps.push({bi:bi, ii:ii, key:key, head:b.head, mid:null, name:it.n, setIdx:1, totalSets:1, target:it.d, anchor:false});
      }
    });
  });
  return steps;
}
function startGuided(){
  RUN.steps = buildGuidedSteps();
  var idx = RUN.steps.length;
  for(var i=0;i<RUN.steps.length;i++){
    if(!(RUN.state[RUN.steps[i].key]||{}).done){ idx = i; break; }
  }
  RUN.stepIdx = idx;
  RUN.mode = 'guided';
  D.active = RUN; save();
  renderRun();
}
function renderGuidedStep(){
  var steps = RUN.steps || [], total = steps.length, idx = RUN.stepIdx;
  document.getElementById('run-prog').style.width = total ? Math.round(Math.min(idx,total)/total*100)+'%' : '100%';
  if(idx >= total){
    RUN.mode = 'review'; D.active = RUN; save();
    toast('All sets done — save whenever you\'re ready');
    renderRun();
    return;
  }
  var st = steps[idx], m = st.mid ? byId(st.mid) : null, html = '';
  html += '<div class="gh gh-main" style="margin-bottom:10px">'+esc(st.head||'')+(st.totalSets>1?' · Set '+st.setIdx+' of '+st.totalSets:'')+'</div>';
  html += '<div style="font-size:21px;font-weight:700;line-height:1.2;margin-bottom:4px">'+esc(st.name)+'</div>';
  if(st.target) html += '<div style="font-size:14.5px;color:var(--text2);margin-bottom:12px">'+esc(st.target)+'</div>';
  if(m && m.vid){
    html += '<video class="sh-v" style="margin-bottom:12px" src="videos/'+m.vid+'" autoplay loop muted playsinline></video>';
  } else if(m){
    html += '<div class="noclip" style="margin-bottom:12px">No clip filmed for this one yet.</div>';
  }
  if(m) html += '<div style="font-size:14.5px;line-height:1.55;color:var(--text2);margin-bottom:14px">'+esc(m.cue)+'</div>';
  if(st.anchor){
    var prevW = (RUN.state[st.key]||{}).w;
    var w0 = prevW!=null ? prevW : anchorWeight(st.mid);
    html += '<div class="wt" style="border-top:none;padding-top:0;margin-top:0;margin-bottom:14px"><label>Weight</label><input id="guided-wt" type="number" inputmode="decimal" value="'+(w0!=null?w0:'')+'"></div>';
  }
  html += '<div style="display:flex;gap:8px;margin-top:6px">';
  if(idx>0) html += '<button class="btn sec" onclick="prevGuidedStep()">‹ Back</button>';
  html += '<button class="btn" onclick="nextGuidedStep()">'+(idx===total-1?'Finish':'Next ›')+'</button>';
  html += '</div>';
  html += '<button class="btn sec sm" style="margin-top:9px;width:100%" onclick="backToReview()">Back to list</button>';
  document.getElementById('run-guided').innerHTML = html;
}
function captureGuidedWeight(){
  if(!RUN || RUN.mode !== 'guided') return;
  var st = (RUN.steps||[])[RUN.stepIdx]; if(!st || !st.anchor) return;
  var el = document.getElementById('guided-wt'); if(!el) return;
  var v = parseFloat(el.value);
  RUN.state[st.key] = RUN.state[st.key] || {};
  RUN.state[st.key].w = isNaN(v) ? null : v;
}
function nextGuidedStep(){
  captureGuidedWeight();
  var st = (RUN.steps||[])[RUN.stepIdx];
  if(st){
    var nextSt = (RUN.steps||[])[RUN.stepIdx+1];
    if(!nextSt || nextSt.key !== st.key){
      RUN.state[st.key] = RUN.state[st.key] || {};
      RUN.state[st.key].done = true;
    }
  }
  RUN.stepIdx += 1;
  D.active = RUN; save();
  renderGuidedStep();
}
function prevGuidedStep(){
  captureGuidedWeight();
  RUN.stepIdx = Math.max(0, RUN.stepIdx-1);
  D.active = RUN; save();
  renderGuidedStep();
}
function backToReview(){
  captureGuidedWeight();
  RUN.mode = 'review';
  D.active = RUN; save();
  renderRun();
}
function toggleEx(bi,ii){
  var k = bi+'_'+ii; RUN.state[k] = RUN.state[k]||{};
  RUN.state[k].done = !RUN.state[k].done;
  D.active = RUN; save(); renderRun();
}
function setWt(bi,ii,v){
  var k = bi+'_'+ii; RUN.state[k] = RUN.state[k]||{};
  RUN.state[k].w = parseFloat(v)||null;
  D.active = RUN; save();
}
function lastAnchor(mid){
  var a = D.anchors[mid];
  if(a && a.length) return a[a.length-1].w;
  return null;
}
function swapMove(bi,ii){
  var it = RUN.sess.blocks[bi].items[ii];
  var m = byId(it.mid); if(!m) return;
  var alts = poolFor(m.cat, curPhase()).filter(function(x){ return x.id !== m.id; }).slice(0,6);
  if(!alts.length){ toast('No alternatives available here'); return; }
  var html = '<div class="grab"></div><div class="sh-t">Swap ' + esc(m.n) + '</div><div class="sh-s">Same slot, different movement.</div>';
  alts.forEach(function(a){
    html += '<button class="rowbtn" onclick="doSwap('+bi+','+ii+',\''+a.id+'\')"><div><div>'+esc(a.n)+'</div><div class="sub">'+esc(rx(a,{}))+'</div></div><span class="ar">›</span></button>';
  });
  openSheet(html);
}
function doSwap(bi,ii,nid){
  var m = byId(nid); if(!m) return;
  var old = RUN.sess.blocks[bi].items[ii];
  RUN.sess.blocks[bi].items[ii] = mkItem(m, {sets:3, anchor:false});
  RUN.state[bi+'_'+ii] = {};
  D.active = RUN; save(); closeSheet(); renderRun();
}
function finishRun(partial){
  var s = RUN.sess, total = 0, done = 0, moves = [];
  s.blocks.forEach(function(b,bi){ b.items.forEach(function(it,ii){
    total++; var st = RUN.state[bi+'_'+ii]||{};
    if(st.done) done++;
    if(it.mid) moves.push(it.mid);
    if(it.anchor && st.w){
      if(!D.anchors[it.mid]) D.anchors[it.mid] = [];
      D.anchors[it.mid].push({date:dkey(), w:st.w});
    }
  }); });
  var isPartial = partial || done < total;
  /* A generated cardio session tagged modId 'walk'/'run' feeds the same
     trend bucket as one logged through the Walk card or free-log. */
  var logKind = (s.modId && TREND_KINDS.indexOf(s.modId)>=0) ? s.modId : s.kind;
  var entry = {
    id:'s-'+Date.now(), date:dkey(), kind:logKind, name:s.title,
    mins: s.effMins || (D.settings.mins==='auto' ? effectiveMins() : D.settings.mins), moves:moves, partial:isPartial,
    detail: done+'/'+total+' done', kids:D.settings.kids
  };
  D.log.push(entry);
  D.active = null; RUN = null;
  showPage('today');
  postLog(entry, isPartial ? 'Logged as partial — still counts' : 'Logged. Nice work.');
  maybePromptCardioDetails(entry, logKind);
}
/* Optional, skippable — lets a generator-driven walk/run feed the same
   trend data a free-logged one does, without making anyone stop and type
   numbers before the session even counts. */
function maybePromptCardioDetails(entry, logKind){
  if(TREND_KINDS.indexOf(logKind)<0) return;
  setTimeout(function(){
    var html = '<div class="grab"></div><div class="sh-t">Add distance &amp; heart rate?</div>' +
      '<div class="sh-s">Optional — helps the app learn your pace over time. Skip anytime.</div>' +
      '<div class="fld"><label>Distance (miles)</label><input id="pc-dist" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 2.1"></div>' +
      '<div class="fld"><label>Avg heart rate</label><input id="pc-hr" type="number" inputmode="numeric" placeholder="e.g. 128"></div>' +
      '<button class="btn" onclick="savePostDetails(\''+entry.id+'\')">Save</button>' +
      '<button class="btn sec" style="margin-top:9px" onclick="closeSheet()">Skip</button>';
    openSheet(html);
  }, 900);
}
function savePostDetails(entryId){
  var entry = D.log.filter(function(l){ return l.id===entryId; })[0];
  if(!entry){ closeSheet(); return; }
  var dv = parseFloat(document.getElementById('pc-dist').value);
  var hv = parseInt(document.getElementById('pc-hr').value,10);
  if(!isNaN(dv) && dv>0) entry.dist = dv;
  if(!isNaN(hv) && hv>0) entry.hr = hv;
  closeSheet();
  /* Routed through postLog so this can never go silent — it was
     previously the one logging path that could save with no toast at all. */
  postLog(entry, 'Saved — thanks!');
}

/* ═══ QUICK + FREE LOGGING ════════════════════════════════════ */
function quickLog(kind){
  var entry = {id:'q-'+Date.now(), date:dkey(), kind:kind, name: kind==='walk'?'Walk':'Session',
               mins:null, moves:[], kids:D.settings.kids};
  D.log.push(entry);
  postLog(entry, 'Logged');
}
var LOGKINDS = [
 {k:'walk',n:'Walk'},{k:'run',n:'Run'},{k:'strength',n:'Strength'},{k:'cardio',n:'Cardio'},
 {k:'yoga',n:'Yoga'},{k:'mobility',n:'Stretch / mobility'},{k:'swim',n:'Swim'},
 {k:'floor',n:'Pelvic floor'},{k:'other',n:'Something else'}
];
/* Distance + HR only make sense for these — kept optional even here,
   never required to log something. */
var DIST_KINDS = ['walk','run','cardio','swim'];

function openLogSheet(presetKind){
  var kinds = LOGKINDS.filter(function(o){ return o.k!=='run' || D.settings.runUnlocked; });
  var html = '<div class="grab"></div><div class="sh-t">Log an activity</div>' +
    '<div class="sh-s">Anything you did. It counts toward this week whether the app suggested it or not.</div>' +
    '<div class="fld"><label>What was it</label><div class="opts" id="lk-opts">' +
    kinds.map(function(o){ return '<button class="opt'+(o.k===presetKind?' on':'')+'" data-k="'+o.k+'" onclick="pickKind(this)">'+o.n+'</button>'; }).join('') +
    '</div></div>' +
    '<div class="fld"><label>Name it (optional)</label><input id="lg-name" placeholder="e.g. prenatal yoga class"></div>' +
    '<div class="fld"><label>Minutes</label><input id="lg-mins" type="number" inputmode="numeric" placeholder="20"></div>' +
    '<div class="fld" id="lg-dist-fld" hidden><label>Distance (miles, optional)</label><input id="lg-dist" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 2.1"></div>' +
    '<div class="fld" id="lg-hr-fld" hidden><label>Avg heart rate (optional, off your watch)</label><input id="lg-hr" type="number" inputmode="numeric" placeholder="e.g. 128"></div>' +
    '<div class="fld"><label>How hard</label><div class="opts" id="le-opts">' +
    ['easy','moderate','hard'].map(function(e){ return '<button class="opt" data-e="'+e+'" onclick="pickEff(this)">'+e+'</button>'; }).join('') +
    '</div></div>' +
    '<button class="btn" onclick="saveFreeLog()">Log it</button>' +
    '<div class="mini" style="text-align:center;margin-top:10px">This adjusts the rest of your week — it does not stack on top. Distance and heart rate are always optional.</div>';
  openSheet(html);
  window._lk = presetKind || null; window._le = null;
  updateLogFieldVisibility();
}
function updateLogFieldVisibility(){
  var show = DIST_KINDS.indexOf(window._lk) >= 0;
  document.getElementById('lg-dist-fld').hidden = !show;
  document.getElementById('lg-hr-fld').hidden = !show;
}
function pickKind(b){
  Array.prototype.forEach.call(document.querySelectorAll('#lk-opts .opt'), function(x){ x.classList.remove('on'); });
  b.classList.add('on'); window._lk = b.dataset.k;
  updateLogFieldVisibility();
}
function pickEff(b){
  Array.prototype.forEach.call(document.querySelectorAll('#le-opts .opt'), function(x){ x.classList.remove('on'); });
  b.classList.add('on'); window._le = b.dataset.e;
}
function saveFreeLog(){
  if(!window._lk){ toast('Pick what it was'); return; }
  var nm = (document.getElementById('lg-name').value||'').trim();
  var mn = parseInt(document.getElementById('lg-mins').value,10) || null;
  var kindName = (LOGKINDS.filter(function(o){return o.k===window._lk;})[0]||{}).n || 'Session';
  var entry = {id:'f-'+Date.now(), date:dkey(), kind:window._lk, name: nm || kindName,
              mins:mn, effort:window._le, moves:[], free:true, kids:D.settings.kids};
  if(DIST_KINDS.indexOf(window._lk) >= 0){
    var dv = parseFloat(document.getElementById('lg-dist').value);
    var hv = parseInt(document.getElementById('lg-hr').value,10);
    if(!isNaN(dv) && dv>0) entry.dist = dv;
    if(!isNaN(hv) && hv>0) entry.hr = hv;
  }
  D.log.push(entry);
  closeSheet();
  postLog(entry, 'Logged — plan adjusted');
}

/* ═══ CONTEXT SHEETS ══════════════════════════════════════════ */

    });

function setCtx(k,v){ D.settings[k] = v; save(); closeSheet(); renderAll(); }
function reroll(){
  var k = dkey();
  D.seedBump[k] = (D.seedBump[k]||0) + 1;
  save(); renderToday(); toast('Different session');
}

/* ═══ MOVEMENT SHEET ══════════════════════════════════════════ */
function showMove(mid){
  var m = byId(mid); if(!m) return;
  var html = '<div class="grab"></div><div class="sh-t">'+esc(m.n)+'</div><div class="sh-s">'+esc(rx(m,{}))+'</div>';
  html += m.vid
    ? '<video class="sh-v" src="videos/'+m.vid+'" autoplay loop muted playsinline></video>'
    : '<div class="noclip">No clip filmed for this one yet.<br>The cue below is the whole story.</div>';
  html += '<div style="font-size:14px;line-height:1.55;color:var(--text2)">'+esc(m.cue)+'</div>';
  if(m.floor==='high' || m.press==='high'){
    html += '<div class="note" style="--nc:var(--p-tan)"><b>Brace-heavy.</b> This one raises pressure through your middle. Exhale on the effort, and stop the set if anything domes or leaks.</div>';
  }
  html += '<button class="btn sec" style="margin-top:14px" onclick="excludeMove(\''+m.id+'\')">Never show me this again</button>';
  openSheet(html);
}
function excludeMove(id){
  if(D.settings.excluded.indexOf(id)<0) D.settings.excluded.push(id);
  save(); closeSheet(); toast('Removed from your plan'); renderAll();
}

/* ═══ PLAN PAGE ═══════════════════════════════════════════════ */
function renderPlan(){
  var pd = phaseDates(), cur = curPhase(), out = '';
  var when = [
    (D.settings.birthDate ? 'until ' + fmtD(pd.birth) : 'now → ' + fmtD(pd.birth)),
    fmtD(pd.birth) + ' → ' + fmtD(pd.p1End),
    fmtD(pd.p1End) + ' → ' + fmtD(pd.p2End),
    fmtD(pd.p2End) + ' → ' + fmtD(pd.ret),
    fmtD(pd.ret) + ' onward'
  ];
  PHASES.forEach(function(p,i){
    out += '<div class="sc" style="--sc-bg:var(--'+p.c+'-bg);--sc-bd:var(--'+(i===cur?p.c+'-border':'border')+')">' +
      '<div class="sc-h"><div class="sc-t">'+p.code+' · '+p.n+(i===cur?' <span style="font-size:11px;color:var(--p-'+p.c+')">you are here</span>':'')+'</div>' +
      '<div class="sc-m">'+when[i]+'</div></div>' +
      '<div class="sc-b"><div style="font-size:13.5px;color:var(--text2);line-height:1.5">'+p.w+'</div>';
    var b = p.budget, bits = [];
    for(var c in b){ if(b[c]) bits.push(b[c]+'× '+c); }
    out += '<div class="mini" style="margin-top:9px">Weekly: '+bits.join(' · ')+'</div>';
    if(i===3){
      out += '<div class="note" style="--nc:var(--p-green)"><b>Six-week load ramp.</b> Goblet squat 15→35 lb · deadlift 15→30 a hand · carry 20→40 a hand. Distance before weight on carries. Load only moves up when the last set left 3 reps in the tank and nothing leaked, domed or hurt.</div>';
    }
    out += '</div></div>';
  });
  document.getElementById('plan-body').innerHTML = out;
}

/* ═══ LOG PAGE ════════════════════════════════════════════════ */
function renderLog(){

  var out = '';
  var recent = D.log.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,60);

        '<div class="lg-m">'+[l.mins?l.mins+' min':'', l.dist?trim(l.dist)+' mi':'', l.hr?'HR '+l.hr:'', l.effort||'', l.detail||''].filter(Boolean).join(' · ')+'</div></div>' +
        '<div class="lg-t">'+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</div>' +
        '<button class="lg-kebab" onclick="openLogDetail(\''+l.id+'\')">⋮</button></div>';

  document.getElementById('log-list').innerHTML = out;
}
/* ═══ LOG DETAIL / DELETE ═════════════════════════════════════ */
function openLogDetail(id){
  var l = D.log.filter(function(x){ return x.id===id; })[0];
  if(!l){ toast('Not found'); return; }
  var d = parseD(l.date) || new Date(l.date);
  var pace = (l.dist && l.mins) ? fmtPace(l.mins/l.dist) : null;
  var kindName = (LOGKINDS.filter(function(o){ return o.k===l.kind; })[0]||{}).n || l.kind;
  var rows = [
    ['Date', d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})],
    ['Type', kindName],
    l.mins ? ['Duration', l.mins+' min'] : null,
    l.dist ? ['Distance', trim(l.dist)+' mi'] : null,
    pace ? ['Pace', pace] : null,
    l.hr ? ['Avg heart rate', l.hr+' bpm'] : null,
    l.effort ? ['Effort', l.effort] : null,
    l.detail ? ['Session', l.detail] : null,
    (l.moves && l.moves.length) ? ['Movements', l.moves.length+' logged'] : null,
    l.partial ? ['Status', 'Partial — still counted'] : null,
    l.kids ? ['Kids around', 'Yes'] : null
  ].filter(Boolean);
  var html = '<div class="grab"></div><div class="sh-t">'+esc(l.name||kindName)+'</div>';
  rows.forEach(function(r){
    html += '<div style="padding:8px 0;border-bottom:1px solid var(--border)">' +
      '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em">'+esc(r[0])+'</div>' +
      '<div style="font-size:15px;margin-top:2px">'+esc(String(r[1]))+'</div></div>';
  });
  html += '<button class="btn sec" style="margin-top:16px;border-color:#c1655f;color:#d98d88" onclick="confirmDeleteLog(\''+id+'\')">Delete this log</button>';
  openSheet(html);
}
function confirmDeleteLog(id){
  var l = D.log.filter(function(x){ return x.id===id; })[0];
  if(!l){ closeSheet(); return; }
  var d = parseD(l.date) || new Date(l.date);
  var kindName = (LOGKINDS.filter(function(o){ return o.k===l.kind; })[0]||{}).n || l.kind;
  var html = '<div class="grab"></div><div class="sh-t">Delete this log?</div>' +
    '<div class="sh-s">'+esc(l.name||kindName)+' on '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'. This can’t be undone.</div>' +
    '<button class="btn" style="background:#c1655f" onclick="deleteLogEntry(\''+id+'\')">Yes, delete it</button>' +
    '<button class="btn sec" style="margin-top:9px" onclick="openLogDetail(\''+id+'\')">Cancel</button>';
  openSheet(html);
}
function deleteLogEntry(id){
  D.log = D.log.filter(function(x){ return x.id!==id; });
  save();
  closeSheet();
  toast('Removed');
  renderAll();
  if(document.getElementById('pg-log').classList.contains('active')) renderLog();
}

/* ═══ PROGRESS PAGE ═══════════════════════════════════════════ */
function renderProg(){
  var out = '';
  if(D.settings.streakOn){
    var sw = streakWeeks();
    out += '<div class="streak"><div class="n">'+sw+'</div><div class="l">'+(sw===1?'week':'weeks')+' in a row hitting your budget</div>' +
      '<div class="mini" style="margin-top:7px;color:var(--text3)">One missed day cannot break this. Only a fully empty week can.</div></div>';
  }
  var wk = logsInWeek(weekStart()).length;
  out += '<div class="card"><div class="card-title">Totals</div><div class="sgrid">' +
    st(D.log.length,'sessions logged') + st(wk,'this week') + st(uniqueMoves(),'movements tried') +
    '</div></div>';

  /* anchors */
  var ak = Object.keys(D.anchors);
  if(ak.length){
    out += '<div class="card"><div class="card-title">Anchor lifts</div>';
    ak.forEach(function(id){
      var m = byId(id), h = D.anchors[id];
      if(!m || !h.length) return;
      var first = h[0].w, last = h[h.length-1].w, delta = last - first;
      out += '<div class="lg"><div class="lg-i"><div class="lg-n">'+esc(m.n)+'</div>' +
        '<div class="lg-m">'+h.length+' sessions logged</div></div>' +
        '<div class="lg-t" style="text-align:right"><div style="font-size:15px;font-weight:600;color:var(--text)">'+last+' lb</div>' +
        (delta>0?'<div style="color:var(--p-green);font-size:11.5px">+'+trim(delta)+' lb</div>':'') + '</div></div>';
    });
    out += '</div>';
  }

  /* cardio trends — same "evidence, not vibes" idea as the anchor cards,
     applied to walking/running distance, pace and heart rate */
  out += renderTrendCard('walk') + renderTrendCard('run');

  /* benchmarks */
  if(D.settings.benchOn){
    out += '<div class="card"><div class="card-title">Benchmarks</div>';
    var set = curPhase()>=4 ? BENCH_HOME.concat(BENCH_STATION) : BENCH_HOME;
    set.forEach(function(b){
      var rows = D.bench.filter(function(x){ return x.testId===b.id; });
      var lastv = rows.length ? rows[rows.length-1].v : null;
      var firstv = rows.length ? rows[0].v : null;
      out += '<button class="rowbtn" onclick="openBench(\''+b.id+'\')"><div><div>'+esc(b.n)+'</div>' +
        '<div class="sub">'+(lastv!==null ? lastv+' '+b.unit+(rows.length>1?' · was '+firstv:'') : 'not tested yet')+'</div></div><span class="ar">+</span></button>';
    });
    out += '<div class="mini" style="margin-top:8px">Not a pass or fail. If two tests in a row show nothing moving, the plan needs changing — not you.</div></div>';
  }

  /* badges */
  out += '<div class="card"><div class="card-title">Along the way</div><div class="bdg">';
  Object.keys(BADGE_N).forEach(function(k){
    out += '<span class="bd'+(D.badges.indexOf(k)>=0?' got':'')+'">'+BADGE_N[k]+'</span>';
  });
  out += '</div></div>';

  document.getElementById('prog-body').innerHTML = out;
}
function st(n,l){ return '<div class="st"><div class="st-n">'+n+'</div><div class="st-l">'+l+'</div></div>'; }
function fmtPaceShort(p){ var s = fmtPace(p); return s ? s.replace('/mi','') : '—'; }
function renderTrendCard(kind){
  var allTime = D.log.filter(function(l){ return l.kind===kind && l.dist; })
                      .sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!allTime.length) return '';
  var label = kind==='run' ? 'Running' : 'Walking';
  var out = '<div class="card"><div class="card-title">'+label+' trend</div>';
  var t = cardioTrend(kind), delta = cardioDelta(kind);
  if(t){
    out += '<div class="sgrid" style="margin-bottom:11px">' +
      st(trim(t.avgDist)+' mi', 'avg distance') +
      st(fmtPaceShort(t.avgPace), 'avg pace / mi') +
      st(D.bestPace[kind]!=null ? fmtPaceShort(D.bestPace[kind]) : '—', 'best pace / mi') +
      '</div>';
    if(delta!=null && Math.abs(delta)>=0.05){
      out += delta>0
        ? '<div class="note" style="--nc:var(--p-green)">Pace improving — about '+fmtPaceShort(Math.abs(delta))+' faster per mile than a few weeks ago.</div>'
        : '<div class="note">A little slower than a few weeks back — normal with everything else going on right now.</div>';
    }
  } else {
    var need = TREND_MIN_ENTRIES - allTime.length;
    out += '<div class="mini">Log '+need+' more with distance and this starts showing trends and a stretch target.</div>';
  }
  out += '<hr class="sep" style="margin:12px 0">';
  allTime.slice(-6).reverse().forEach(function(e){
    var d = parseD(e.date) || new Date(e.date);
    var pace = (e.dist && e.mins) ? fmtPace(e.mins/e.dist) : null;
    out += '<div class="lg"><div class="lg-i"><div class="lg-n">'+trim(e.dist)+' mi'+(e.mins?' · '+e.mins+' min':'')+(pace?' · '+pace:'')+'</div>' +
      (e.hr?'<div class="lg-m">avg HR '+e.hr+'</div>':'') + '</div>' +
      '<div class="lg-t">'+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</div></div>';
  });
  out += '</div>';
  return out;
}
function uniqueMoves(){ var o = {}; D.log.forEach(function(l){ (l.moves||[]).forEach(function(m){o[m]=1;}); }); return Object.keys(o).length; }
function openBench(id){
  var all = BENCH_HOME.concat(BENCH_STATION);
  var b = all.filter(function(x){return x.id===id;})[0]; if(!b) return;
  var rows = D.bench.filter(function(x){ return x.testId===id; });
  var html = '<div class="grab"></div><div class="sh-t">'+esc(b.n)+'</div><div class="sh-s">'+esc(b.hint)+'</div>' +
    '<div class="fld"><label>Result — '+esc(b.unit)+'</label><input id="bv" type="number" inputmode="decimal"></div>' +
    '<button class="btn" onclick="saveBench(\''+id+'\')">Record it</button>';
  if(rows.length){
    html += '<hr class="sep"><div class="card-title">History</div>';
    rows.slice().reverse().forEach(function(r){
      html += '<div class="lg"><div class="lg-i"><div class="lg-n">'+r.v+' '+esc(b.unit)+'</div></div><div class="lg-t">'+r.date+'</div></div>';
    });
  }
  openSheet(html);
}
function saveBench(id){
  var v = parseFloat(document.getElementById('bv').value);
  if(isNaN(v)){ toast('Enter a number'); return; }
  D.bench.push({testId:id, v:v, date:dkey()});
  save(); closeSheet(); toast('Recorded'); renderProg();
}

function toggleGear(g){ D.settings.gear[g] = !D.settings.gear[g]; save(); renderMore(); renderToday(); }

function setPhase(p){ D.settings.phasePin = p; save(); closeSheet(); renderAll(); toast(p===null?'Following the calendar':'Pinned to '+PHASES[p].code); }
function openDates(){

function setDel(v, b){

  b.classList.add('on');
}
function saveDates(){
  D.settings.dueDate = document.getElementById('d-due').value || null;
  D.settings.birthDate = document.getElementById('d-birth').value || null;
  D.settings.returnDate = document.getElementById('d-ret').value || null;
  save(); closeSheet(); renderAll(); toast('Dates updated');
}
function openSymptoms(){
  var last = D.symptomChecks && D.symptomChecks.length ? D.symptomChecks[D.symptomChecks.length-1] : null;
  var html = '<div class="grab"></div><div class="sh-t">Symptom check</div>' +
    '<div class="sh-s">Answer honestly. Any yes holds you where you are another week rather than pushing on — that is what protects the six weeks after this.</div>';
  html += '<div class="opts" id="sym-opts" style="flex-direction:column;align-items:stretch;gap:8px">';

  }
