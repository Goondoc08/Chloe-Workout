function saveSymptomCheck(){
  var flagged = document.querySelectorAll('#sym-opts .opt.on').length;
  D.symptomChecks = D.symptomChecks || [];
  D.symptomChecks.push({date:dkey(), any: flagged>0, count:flagged});
  save(); closeSheet(); renderAll();
  toast(flagged>0 ? 'Noted — staying put another week' : 'All clear, saved');
}
/* True only once a clear check exists at or after P2 started — this is what actually
   holds P3 back on symptoms rather than the calendar alone. */
function p2Cleared(){
  var pd = phaseDates();
  var checks = (D.symptomChecks||[]).filter(function(c){ return parseD(c.date) >= pd.p1End; });
  if(!checks.length) return false;
  var last = checks[checks.length-1];
  return !last.any;
}
function openRunGate(){
  var s = D.settings;
  var html = '<div class="grab"></div><div class="sh-t">Running</div>' +
    '<div class="sh-s">Not a date — a test. Running stays locked until all six are true. Failing is fine, retest whenever.</div>';
  RUN_GATE.forEach(function(g){ html += '<div class="lg"><div class="lg-i"><div class="lg-n" style="font-weight:400;font-size:13.5px">'+esc(g)+'</div></div></div>'; });
  html += s.runUnlocked
    ? '<button class="btn sec" style="margin-top:14px" onclick="setRun(false)">Lock it again</button>'
    : '<button class="btn" style="margin-top:14px" onclick="setRun(true)">All six — unlock running</button>';
  openSheet(html);
}
function setRun(v){ D.settings.runUnlocked = v; save(); closeSheet(); renderAll(); toast(v?'Running unlocked':'Running locked'); }
function openExcluded(){
  var html = '<div class="grab"></div><div class="sh-t">Removed movements</div><div class="sh-s">These never appear in a generated session.</div>';
  if(!D.settings.excluded.length) html += '<div class="empty">Nothing removed.</div>';
  D.settings.excluded.forEach(function(id){
    var m = byId(id); if(!m) return;
    html += '<button class="rowbtn" onclick="unexclude(\''+id+'\')"><div>'+esc(m.n)+'</div><span class="ar">put back</span></button>';
  });
  openSheet(html);
}
function unexclude(id){
  D.settings.excluded = D.settings.excluded.filter(function(x){ return x!==id; });
  save(); openExcluded(); renderAll();
}
function exportData(){
  var blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bkfit-backup-'+dkey()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Backup saved');
}
function importData(){
  var i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var obj = JSON.parse(r.result);
        if(!obj || !obj.settings) throw 0;
        D = obj; save(); renderAll(); toast('Backup restored');
      }catch(e){ toast('That file did not look right'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ═══ SHEET / TOAST / NAV ═════════════════════════════════════ */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('ov').classList.add('on');
}
function closeSheet(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click', function(e){ if(e.target.id==='ov') closeSheet(); });

var toastT = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('on'); }, 2000);
}
function showPage(p){
  Array.prototype.forEach.call(document.querySelectorAll('.page'), function(x){ x.classList.remove('active'); });
  var el = document.getElementById('pg-'+p); if(el) el.classList.add('active');
  Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'), function(b){
    b.classList.toggle('active', b.dataset.pg === p);
  });
  window.scrollTo(0,0);
  if(p==='plan') renderPlan();
  if(p==='log') renderLog();
  if(p==='prog') renderProg();
  if(p==='more') renderMore();
}
Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'), function(b){
  b.addEventListener('click', function(){ showPage(b.dataset.pg); });
});

/* readiness inputs */
Array.prototype.forEach.call(document.querySelectorAll('#rd-row .rd-btn'), function(b){
  b.addEventListener('click', function(){
    var k = dkey();
    D.readiness[k] = D.readiness[k] || {};
    D.readiness[k].feel = (D.readiness[k].feel === b.dataset.r) ? null : b.dataset.r;
    save(); renderToday();
  });
});
/* Live number while dragging (muted, uncommitted); commit + rebase tier only on release —
   so a slider that always shows *some* position doesn't silently fake a reading she never gave. */
document.getElementById('bb-slider').addEventListener('input', function(){
  paintBB(null, this.value);
});
document.getElementById('bb-slider').addEventListener('change', function(){
  var k = dkey(), v = parseInt(this.value,10);
  D.readiness[k] = D.readiness[k] || {};
  D.readiness[k].bb = isNaN(v) ? null : v;
  save(); renderToday();
});

function renderAll(){ renderToday(); }

/* ═══ WHAT'S NEW ══════════════════════════════════════════════ */
function maybeShowWelcome(){
  if(D.seenWelcome === BUILD) return false;
  var html = '<div class="grab"></div><div class="sh-t">This app changed</div>' +
    '<div class="sh-s">Same app, rebuilt around what you told me. A few things worth knowing before you dig in:</div>' +
    '<div class="feat" style="margin:4px 0 14px">' +
      '<div style="background:var(--card2);border-radius:11px;padding:11px 13px"><b style="font-size:13.5px">The starting weights are lighter than before.</b><div style="font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.45">You said the old numbers looked too heavy. You were right — they are cut across the board, and P3 climbs slowly over six weeks from there.</div></div>' +
      '<div style="background:var(--card2);border-radius:11px;padding:11px 13px;margin-top:1px"><b style="font-size:13.5px">Nothing is scripted anymore.</b><div style="font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.45">Tap <b>Did something else today?</b> any time — a walk, yoga, a hike. It counts, and the rest of your week adjusts around it.</div></div>' +
      '<div style="background:var(--card2);border-radius:11px;padding:11px 13px;margin-top:1px"><b style="font-size:13.5px">Your old history is still here.</b><div style="font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.45">Past workouts carried over. Nothing was lost.</div></div>' +
    '</div>' +
    '<button class="btn" onclick="D.seenWelcome=BUILD;save();closeSheet()">Got it</button>';
  openSheet(html);
  return true;
}

/* ═══ INIT ════════════════════════════════════════════════════ */
load();
renderToday();
var welcomed = maybeShowWelcome();
if(D.active && !welcomed){
  setTimeout(function(){
    var s = D.active.sess;
    openSheet('<div class="grab"></div><div class="sh-t">Pick up where you left off?</div>' +
      '<div class="sh-s">'+esc(s.title)+' — '+esc(s.meta)+'</div>' +
      '<button class="btn" onclick="closeSheet();resumeRun()">Carry on</button>' +
      '<button class="btn sec" style="margin-top:9px" onclick="D.active=null;save();closeSheet()">Start fresh</button>');
  }, 400);
}
/* Phase-crossing badges (e.g. "Back on duty") can happen from a date
   alone, not just a logged action — catch that on open, not just on log. */
if(!D.active && !welcomed){
  setTimeout(function(){
    var nb = checkBadges();
    if(nb.length){ save(); toastQueue(nb.map(badgeMsg)); }
  }, 700);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
